name: MCNPU Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Fetch verified QNN stack
        run: git clone --depth 1 https://github.com/bslsjdk/npu_probe.git qnn_probe
      - name: Stage QNN HTP V73 libraries
        run: |
          set -eux
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp qnn_probe/app/src/main/jniLibs/arm64-v8a/libc++_shared.so app/src/main/jniLibs/arm64-v8a/
          cp qnn_probe/app/src/main/assets/qnnlibs/libQnnHtp.so app/src/main/jniLibs/arm64-v8a/
          cp qnn_probe/app/src/main/jniLibs/arm64-v8a/libQnnHtpV73Stub.so app/src/main/jniLibs/arm64-v8a/
          cp qnn_probe/app/src/main/jniLibs/arm64-v8a/libQnnHtpV73Skel.so app/src/main/jniLibs/arm64-v8a/
          cp qnn_probe/app/src/main/jniLibs/arm64-v8a/libQnnSystem.so app/src/main/jniLibs/arm64-v8a/
          gzip -dc qnn_probe/app/src/main/assets/qnnlibs/libQnnHtpPrepare.so.gz > app/src/main/jniLibs/arm64-v8a/libQnnHtpPrepare.so
      - name: Build native
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          cmake -S app/src/main/cpp -B build/native -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-35 -DQNN_INC="$GITHUB_WORKSPACE/qnn_probe/app/src/main/cpp/qnn_inc"
          cmake --build build/native --config Release
          cp build/native/libmcnpu.so app/src/main/jniLibs/arm64-v8a/libmcnpu.so
      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MCNPU-arm64
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
